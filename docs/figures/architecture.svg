<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5}
      .trust{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}
      .untrusted{fill:#f8fafc;stroke:#94a3b8;stroke-width:1;stroke-dasharray:5 4}
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .l{font-size:12px;fill:#334155}
      .lr{font-size:12px;fill:#0f766e;font-weight:600}
      .zone{font-size:12px;font-weight:600;fill:#64748b;letter-spacing:.06em}
      .ln{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .rd{stroke:#0f766e;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}
    </style>
  </defs>

  <!-- zone: operator infrastructure (untrusted by the auditor) -->
  <rect class="untrusted" x="10" y="10" width="640" height="300" rx="10"/>
  <text class="zone" x="24" y="32">OPERATOR SIDE: AN INSIDER CAN CHANGE ANYTHING HERE</text>

  <rect class="box" x="30" y="50" width="170" height="64" rx="8"/>
  <text class="t" x="44" y="76">UIBM Grades app</text>
  <text class="s" x="44" y="96">professor enters grades</text>

  <rect class="box" x="30" y="150" width="170" height="80" rx="8"/>
  <text class="t" x="44" y="176">Supabase Postgres</text>
  <text class="s" x="44" y="196">audit triggers,</text>
  <text class="s" x="44" y="212">Auth audit log</text>

  <rect class="box" x="250" y="150" width="130" height="80" rx="8"/>
  <text class="t" x="264" y="176">Collector</text>
  <text class="s" x="264" y="196">every 10 s,</text>
  <text class="s" x="264" y="212">+ heartbeats</text>

  <rect class="box" x="430" y="50" width="200" height="180" rx="8"/>
  <text class="t" x="444" y="76">Vula log server</text>
  <text class="s" x="444" y="100">RFC 6962 Merkle tree</text>
  <text class="s" x="444" y="118">(own implementation)</text>
  <text class="s" x="444" y="146">checkpoint every 1–5 min:</text>
  <text class="s" x="444" y="164">size, root, prev root,</text>
  <text class="s" x="444" y="182">consistency proof,</text>
  <text class="s" x="444" y="200">Ed25519 signature</text>
  <text class="s" x="444" y="218">anchor worker: 1 in flight</text>

  <rect class="box" x="250" y="250" width="380" height="44" rx="8"/>
  <text class="t" x="264" y="277">Stored leaves + payload mirror</text>
  <text class="s" x="490" y="277">(untrusted copies)</text>

  <path class="ln" d="M115,114 V150"/>
  <path class="ln" d="M200,190 H250"/>
  <path class="ln" d="M380,190 H430"/>
  <path class="ln" d="M530,230 V250"/>

  <!-- Compellio + chain -->
  <rect class="box" x="700" y="50" width="280" height="80" rx="8"/>
  <text class="t" x="714" y="76">Compellio Registry API</text>
  <text class="s" x="714" y="96">DCAP.Web · POST /api/v1/TAR (first),</text>
  <text class="s" x="714" y="114">PUT /api/v1/TAR/{id} (every next)</text>

  <rect class="trust" x="700" y="170" width="280" height="90" rx="8"/>
  <text class="t" x="714" y="196">TAR contract on Etherlink</text>
  <text class="s" x="714" y="216">one TAR version per checkpoint</text>
  <text class="s" x="714" y="234">checksum = SHA-256(JCS(payload))</text>
  <text class="lr" x="714" y="252">the only trust anchor</text>

  <path class="ln" d="M630,90 H700"/>
  <text class="l" x="636" y="82">signed</text>
  <path class="ln" d="M840,130 V170"/>
  <text class="l" x="848" y="155">push(checksum)</text>

  <!-- verifier side -->
  <text class="zone" x="24" y="350">AUDITOR / PARTNER: TRUSTS ONLY THE CHAIN</text>
  <rect class="box" x="30" y="365" width="330" height="90" rx="8"/>
  <text class="t" x="44" y="391">vula CLI + dashboard</text>
  <text class="s" x="44" y="411">verify-log: log vs chain</text>
  <text class="s" x="44" y="429">reconcile: source vs log</text>
  <text class="s" x="44" y="447">verify-event: one event's inclusion proof</text>

  <rect class="box" x="420" y="365" width="230" height="90" rx="8"/>
  <text class="t" x="434" y="391">Compellio BCBCTI</text>
  <text class="s" x="434" y="411">alerts as STIX 2.1 incidents,</text>
  <text class="s" x="434" y="429">one TAR each;</text>
  <text class="s" x="434" y="447">partner CERT: verify-cti</text>

  <path class="rd" d="M840,260 V410 H360"/>
  <text class="lr" x="660" y="402">reads totalVersions / getChecksum / dataUri</text>
  <path class="ln" d="M195,365 V294 H250" stroke-dasharray="3 3"/>
  <text class="l" x="64" y="330">fetches + recomputes</text>
  <path class="ln" d="M360,440 H420"/>
</svg>
